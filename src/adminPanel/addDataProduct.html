/* =========================================================

function getProductData() {


    /* -----------------------------------------------------
       Дополнительные изображения
    ----------------------------------------------------- */

    const dopImages = [];

    document
        .querySelectorAll("[data-image]")
        .forEach(input => {

            const value =
                input.value.trim();

            if (value) {

                dopImages.push(value);

            }

        });



    /* -----------------------------------------------------
       Параметры
    ----------------------------------------------------- */

    const discriptionParam = [];

    document
        .querySelectorAll("#parameters .row")
        .forEach(row => {

            const name =
                row.querySelector(
                    "[data-name]"
                )?.value.trim() || "";

            const param =
                row.querySelector(
                    "[data-param]"
                )?.value.trim() || "";


            if (name || param) {

                discriptionParam.push({

                    name: name,

                    param: param

                });

            }

        });



    /* -----------------------------------------------------
       Склады
    ----------------------------------------------------- */

    const warehouse = [];

    document
        .querySelectorAll("#warehouse .row")
        .forEach(row => {

            const name =
                row.querySelector(
                    "[data-warehouse-name]"
                )?.value.trim() || "";


            const quantity =
                Number(
                    row.querySelector(
                        "[data-warehouse-quantity]"
                    )?.value || 0
                );


            if (name) {

                warehouse.push({

                    name: name,

                    quantity: quantity

                });

            }

        });



    /* -----------------------------------------------------
       Характеристики
    ----------------------------------------------------- */

    const characteristics = [];

    document
        .querySelectorAll("#characteristics .row")
        .forEach(row => {

            const name =
                row.querySelector(
                    "[data-characteristic-name]"
                )?.value.trim() || "";


            const characteristic =
                row.querySelector(
                    "[data-characteristic-value]"
                )?.value.trim() || "";


            if (name || characteristic) {

                characteristics.push({

                    name: name,

                    characteristic:
                        characteristic

                });

            }

        });



    /* -----------------------------------------------------
       Файлы
    ----------------------------------------------------- */

    const file = [];

    document
        .querySelectorAll("#files .row")
        .forEach(row => {

            const name =
                row.querySelector(
                    "[data-file-name]"
                )?.value.trim() || "";


            const link =
                row.querySelector(
                    "[data-file-link]"
                )?.value.trim() || "";


            if (name || link) {

                file.push({

                    name: name,

                    link: link

                });

            }

        });



    /* -----------------------------------------------------
       Итоговый объект
    ----------------------------------------------------- */

    return {


        mainImagePage:
            document.getElementById(
                "mainImagePage"
            ).value.trim(),


        vendorCode:
            document.getElementById(
                "vendorCode"
            ).value.trim(),


        nameComponent:
            document.getElementById(
                "nameComponent"
            ).value.trim(),


        manufacturer:
            document.getElementById(
                "manufacturer"
            ).value.trim(),


        quantity:
            Number(
                document.getElementById(
                    "quantity"
                ).value
            ),


        deliveryТime:
            Number(
                document.getElementById(
                    "deliveryTime"
                ).value
            ),


        price:
            Number(
                document.getElementById(
                    "price"
                ).value
            ),


        bestseller:
            Number(
                document.getElementById(
                    "bestseller"
                ).value
            ),


        chapter:
            document.getElementById(
                "chapter"
            ).value,

        productDescription:
            document.getElementById(
                "productDescription"
            ).value.trim(),


        origin:
            document.getElementById(
                "origin"
            ).value.trim(),


        ozonLink:
            document.getElementById(
                "ozonLink"
            ).value.trim(),


        dopImages:
            dopImages,


        discriptionParam:
            discriptionParam,


        warehouse:
            warehouse,


        characteristics:
            characteristics,


        file:
            file

    };

}



/* =========================================================
   СФОРМИРОВАТЬ JSON
========================================================= */

function generateJSON() {

    const product =
        getProductData();


    document.getElementById(
        "result"
    ).value = JSON.stringify(
        product,
        null,
        4
    );

}



/* =========================================================
   КОПИРОВАТЬ JSON
========================================================= */

async function copyJSON() {

    const result =
        document.getElementById(
            "result"
        );


    if (!result.value.trim()) {

        generateJSON();

    }


    try {

        await navigator.clipboard.writeText(
            result.value
        );


        showAPIMessage(
            "JSON скопирован в буфер обмена.",
            "success"
        );


    } catch (error) {

        showAPIMessage(
            "Не удалось скопировать JSON.",
            "danger"
        );

    }

}



/* =========================================================
   ОТПРАВКА НА API
========================================================= */

async function sendToAPI() {


    const result =
        document.getElementById(
            "result"
        );


    /*
        Если JSON ещё не сформирован,
        формируем его автоматически.
    */

    if (!result.value.trim()) {

        generateJSON();

    }


    let product;


    /*
        Проверяем JSON
    */

    try {

        product =
            JSON.parse(
                result.value
            );

    } catch (error) {

        showAPIMessage(
            "Ошибка: JSON имеет неправильный формат.",
            "danger"
        );

        return;

    }



    /*
        =====================================================
        ВАЖНО

        Здесь указываем реальный адрес
        твоего ASP.NET API.
        =====================================================
    */

    const API_URL =
        "https://твой-api.ru/api/products";



    /*
        Отправляем JSON
    */

    try {

        showAPIMessage(
            "Отправка данных...",
            "info"
        );


        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(product)

                }
            );



        /*
            Проверяем HTTP статус
        */

        if (!response.ok) {

            const errorText =
                await response.text();


            throw new Error(
                "HTTP " +
                response.status +
                ": " +
                errorText
            );

        }



        /*
            Пытаемся получить ответ JSON
        */

        let data = null;


        try {

            data =
                await response.json();

        } catch {

            data = null;

        }

        showAPIMessage(
            "Товар успешно отправлен на API.",
            "success"
        );


        console.log(
            "Ответ API:",
            data
        );


    } catch (error) {

        console.error(
            "Ошибка API:",
            error
        );


        showAPIMessage(
            "Ошибка отправки: " +
            error.message,
            "danger"
        );

    }

}



/* =========================================================
   СООБЩЕНИЕ API
========================================================= */

function showAPIMessage(
    message,
    type
) {

    document.getElementById(
        "apiResult"
    ).innerHTML = `

        <div class="alert alert-${type}">
            ${message}
        </div>

    `;

}



/* =========================================================
   ОЧИСТИТЬ JSON
========================================================= */

function clearJSON() {

    document.getElementById(
        "result"
    ).value = "";


    document.getElementById(
        "apiResult"
    ).innerHTML = "";

}
